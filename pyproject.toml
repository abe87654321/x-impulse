[project]
name = "kb-rag"
version = "0.1.0"
description = "企业知识库 RAG 平台（PF-1 企业内部档）"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
# 数据面依赖单独一组：服务面开发不必装，CI 也不必装
ml = [
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "unstructured[pdf]>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

# ── pytest ────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要数据库或外部服务，默认在单元测试轮次中排除",
]
# 让 tests/permission/builders.py 能被 test_vectors.py 直接 import
pythonpath = ["."]
addopts = "-ra --strict-markers"

# ── ruff ──────────────────────────────────────────────────
[tool.ruff]
line-length = 100
# ★ 锁在 requires-python 的下限，不是开发机上装的版本。
# 开发机跑 3.14、这里写 py314 的话，agent 会写出 3.12 跑不了的语法，
# 而你在本机永远测不出来 —— 客户机器上才炸。
target-version = "py312"
# docs/ 里的 Python 代码块是规格，手工对齐，不受格式化器管辖。
# 不排除的话 `ruff format` 会重排 TD-02/TD-03 的 dataclass 对齐。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]   # 测试里用 assert 是正常的

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

# ── mypy ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"   # 同上：锁下限，不是开发机版本
strict = true
# 权限模块是安全关键，不允许任何隐式 Any
[[tool.mypy.overrides]]
module = "kb.identity.*"
disallow_any_explicit = true
