# 开发环境。生产部署另有编排，不用这份。
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: kb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql 首次启动自动执行
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
